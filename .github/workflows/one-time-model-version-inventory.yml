name: One-time model catalog release inventory
on:
  push:
    branches: [fix/ci-pinned-regression-catalog]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Inventory published releases
        run: |
          npm view '@earendil-works/pi-ai' time --json > /tmp/releases.json
          node -e 'const x=require("/tmp/releases.json"); console.log("releases",Object.entries(x).filter(([k])=>k[0]>="0" && k[0]<="9").slice(-45));'
      - name: Remove inventory workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-time-model-version-inventory.yml
          git commit -m "ci: remove one-time version inventory"
          git push origin HEAD:fix/ci-pinned-regression-catalog

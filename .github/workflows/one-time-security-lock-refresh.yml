name: One-time security lockfile refresh

on:
  push:
    branches:
      - fix/pi-npm-audit-20261102

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'grimlee/pi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile without dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh transitive undici 6.x security patch
        run: |
          npm update undici --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package-lock.json").packages; const versions=Object.entries(p).filter(([k])=>k.endsWith("/node_modules/undici")||k==="node_modules/undici").map(([k,v])=>k+"@"+v.version); console.log(versions.join("\\n")); if (versions.some(x=>x.endsWith("@6.29.0"))) process.exit(1)'

      - name: Verify lockfile resolves with clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Refresh published coding-agent locks
        run: |
          npm run shrinkwrap:coding-agent
          npm run install-lock:coding-agent
          npm run check:pinned-deps
          npm run check:shrinkwrap
          npm run check:install-lock:coding-agent

      - name: Gate on production security advisories
        run: node scripts/npm-audit.mjs

      - name: Verify npm registry signatures
        run: npm audit signatures --omit=dev

      - name: Commit regenerated lockfiles and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/coding-agent/npm-shrinkwrap.json packages/coding-agent/install-lock/package.json packages/coding-agent/install-lock/package-lock.json
          git rm -- .github/workflows/one-time-security-lock-refresh.yml
          git diff --cached --check
          git commit -m "chore(lockfile): regenerate audited dependency graph"
          git push origin HEAD:fix/pi-npm-audit-20261102

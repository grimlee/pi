name: One-time published catalog fixture matrix
on:
  push:
    branches: [fix/ci-pinned-regression-catalog]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.2.0", "1.3.0", "1.4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Live catalog build
        run: npm run build
      - name: Restore published catalog candidate
        run: |
          fixture_dir="$(mktemp -d)"
          npm pack "@earendil-works/pi-ai@${{ matrix.version }}" --ignore-scripts --silent --pack-destination "$fixture_dir"
          tar -xzf "$fixture_dir"/*.tgz -C "$fixture_dir"
          test -f "$fixture_dir/package/dist/providers/data/.manifest.json"
          rm -rf packages/ai/src/providers/data
          cp -a "$fixture_dir/package/dist/providers/data" packages/ai/src/providers/data
          npm run check:model-data
      - name: Static check
        run: npm run check
      - name: AI package test
        run: npm run test --workspace=@earendil-works/pi-ai
      - name: Coding agent package test
        run: npm run test --workspace=@earendil-works/pi-coding-agent
  cleanup:
    needs: [probe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Remove one-time matrix workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-time-catalog-version-matrix.yml
          git commit -m "ci: remove completed catalog version matrix"
          git push origin HEAD:fix/ci-pinned-regression-catalog

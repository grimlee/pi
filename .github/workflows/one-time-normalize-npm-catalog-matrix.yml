name: One-time normalized npm catalog fixtures
on:
  push:
    branches: [fix/ci-pinned-regression-catalog]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.2.0", "1.3.0", "1.4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build from live current model catalog
        run: npm run build
      - name: Normalize archived JSON to current per-API format
        run: |
          fixture_dir="$(mktemp -d)"
          npm pack "@earendil-works/pi-ai@${{ matrix.version }}" --ignore-scripts --silent --pack-destination "$fixture_dir"
          tar -xzf "$fixture_dir"/*.tgz -C "$fixture_dir"
          export ARCHIVE_JSON_DIR="$fixture_dir/package/dist/providers/data"
          node --input-type=module <<'END'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createModelDataManifest, readModelDataStructure } from './packages/ai/scripts/model-data.ts';
          const src='packages/ai/src/providers/data', archived=process.env.ARCHIVE_JSON_DIR;
          let converted=0, held=0, models=0;
          for (const file of readdirSync(src).filter(f=>f.endsWith('.json')&&f!=='.manifest.json')) {
            let old;
            try { old=JSON.parse(readFileSync(join(archived,file),'utf8')); } catch {held++;continue}
            const updated={};
            function add(m) {
              if(!m||typeof m!=='object'||typeof m.id!=='string'||typeof m.api!=='string'||typeof m.provider!=='string')throw Error('Invalid archived model in '+file);
              const g=updated[m.api]??={};
              if(g[m.id]!==undefined) throw Error('Duplicate '+file+'/'+m.id);
              g[m.id]=m;models++;
            }
            for(const [k,v] of Object.entries(old)){
              if(v?.id && v?.api) add(v);
              else for(const m of Object.values(v??{}))add(m);
            }
            writeFileSync(join(src,file),JSON.stringify(updated,null,'\t')+'\n');
            converted++;
          }
          const files=Object.fromEntries(readdirSync(src).filter(f=>f.endsWith('.json')&&f!=='.manifest.json').map(f=>[f,readFileSync(join(src,f),'utf8')]));
          const structure=readModelDataStructure('packages/ai');
          writeFileSync(join(src,'.manifest.json'),JSON.stringify(createModelDataManifest(structure,files,'2026-10-14T00:00:00Z'),null,'\t')+'\n');
          console.log({converted,held,models});
          END
          npm run check:model-data
      - name: Offline rebuild with normalized fixture
        run: npm run build:offline
      - name: Strict static checks
        run: npm run check
      - name: AI suite
        run: npm run test --workspace=@earendil-works/pi-ai
      - name: Coding Agent suite
        run: npm run test --workspace=@earendil-works/pi-coding-agent
  cleanup:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Delete temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-time-normalize-npm-catalog-matrix.yml
          git commit -m "ci: remove normalized npm model catalog probe"
          git push origin HEAD:fix/ci-pinned-regression-catalog

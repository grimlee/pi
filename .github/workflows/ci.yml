name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Build validates the newest live models.dev/OpenRouter catalog and compiles
      # all runtime packages. Regression assertions require a reproducible catalog:
      # otherwise upstream model removal/renaming breaks unrelated PR checks.
      # This pinned, published package is immutable. Intentionally bump this exact
      # version together with model-test expectations; never use an unpinned tag.
      - name: Validate live model catalog
        run: npm run check:model-data

      - name: Restore pinned model catalog for deterministic regression tests
        run: |
          fixture_dir="$(mktemp -d)"
          npm pack @earendil-works/pi-ai@0.86.1 --ignore-scripts --silent --pack-destination "$fixture_dir"
          tar -xzf "$fixture_dir"/*.tgz -C "$fixture_dir"
          test -f "$fixture_dir/package/dist/providers/data/.manifest.json"
          rm -rf packages/ai/src/providers/data
          cp -a "$fixture_dir/package/dist/providers/data" packages/ai/src/providers/data
          npm run check:model-data

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

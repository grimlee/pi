name: Build Windows x64 for intranet

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Official Pi tag/branch/commit (for example v1.0.4 or main)'
        required: false
        type: string
        default: 'v1.0.4'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-win.yml'

permissions:
  contents: write

concurrency:
  group: build-win-intranet-${{ inputs.ref || 'v1.0.4' }}
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: ubuntu-latest
    env:
      BUILD_REF: ${{ inputs.ref || 'v1.0.4' }}
    steps:
      - name: Checkout official Pi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: earendil-works/pi
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build official Windows x64 package
        run: |
          set -euo pipefail
          ./scripts/build-binaries.sh \
            --offline-model-data \
            --platform windows-x64 \
            --out "${GITHUB_WORKSPACE}/out"

          test -f out/pi-windows-x64.zip
          ls -lh out/pi-windows-x64.zip

      - name: Convert package to 5 MiB base64 text parts
        run: |
          set -euo pipefail

          version="$(node -p "require('./packages/coding-agent/package.json').version")"
          source_sha="$(git rev-parse HEAD)"
          zip_sha="$(sha256sum out/pi-windows-x64.zip | awk '{print $1}')"

          rm -rf publish
          mkdir -p publish

          base64 -w 76 out/pi-windows-x64.zip | split -b 5M -d -a 3 - publish/pi.b64.

          {
            echo "source_repository=earendil-works/pi"
            echo "source_ref=${BUILD_REF}"
            echo "source_sha=${source_sha}"
            echo "pi_version=${version}"
            echo "archive=pi-windows-x64.zip"
            echo "archive_sha256=${zip_sha}"
            echo "encoding=base64"
            echo "part_size=5MiB"
          } > publish/BUILD_INFO.txt

          printf '%s  %s\n' "${zip_sha}" "pi-windows-x64.zip" > publish/SHA256SUMS.txt

          cat > publish/RESTORE.ps1 <<'POWERSHELL'
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem -Path $PSScriptRoot -Filter "pi.b64.*" | Sort-Object Name
          if (-not $parts) { throw "No pi.b64.* files found." }

          $joined = Join-Path $env:TEMP "pi-windows-x64.b64"
          $zip = Join-Path $PSScriptRoot "pi-windows-x64.zip"

          Remove-Item $joined -Force -ErrorAction SilentlyContinue
          foreach ($part in $parts) {
              Get-Content -LiteralPath $part.FullName | Add-Content -LiteralPath $joined
          }

          $text = Get-Content -LiteralPath $joined -Raw
          $bytes = [Convert]::FromBase64String(($text -replace '\s',''))
          [IO.File]::WriteAllBytes($zip, $bytes)
          Remove-Item $joined -Force

          Write-Host "Created $zip"
          Get-FileHash -Algorithm SHA256 $zip
          POWERSHELL

          echo "Generated base64 parts:"
          ls -lh publish/pi.b64.*
          cat publish/BUILD_INFO.txt

      - name: Push text parts to dl branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd publish

          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b dl

          git add pi.b64.* BUILD_INFO.txt SHA256SUMS.txt RESTORE.ps1
          git commit -q -m "Pi Windows x64 ${BUILD_REF}"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/dl

      - name: Summary
        run: |
          {
            echo '### Windows x64 intranet build'
            echo
            echo "Source: earendil-works/pi"
            echo "Ref: ${BUILD_REF}"
            echo "Output: dl branch as 5 MiB base64 text parts"
            echo "Restore on Windows with RESTORE.ps1"
          } >> "${GITHUB_STEP_SUMMARY}"

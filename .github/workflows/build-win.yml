name: Build Windows x64 (latest upstream)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Official Pi tag/branch/commit to build (for example v1.0.4 or main)'
        required: false
        type: string
        default: 'v1.0.4'

permissions:
  contents: read

concurrency:
  group: build-win-upstream-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official Pi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: earendil-works/pi
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build Windows x64
        run: |
          set -euo pipefail
          ./scripts/build-binaries.sh \
            --offline-model-data \
            --platform windows-x64 \
            --out "${GITHUB_WORKSPACE}/out"

      - name: Record build metadata
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/coding-agent/package.json').version")"
          sha="$(git rev-parse HEAD)"
          {
            echo "source_repository=earendil-works/pi"
            echo "source_ref=${{ inputs.ref }}"
            echo "source_sha=${sha}"
            echo "pi_version=${version}"
          } > out/BUILD_INFO.txt
          (cd out && sha256sum pi-windows-x64.zip > SHA256SUMS)
          cat out/BUILD_INFO.txt
          cat out/SHA256SUMS

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-windows-x64
          path: |
            out/pi-windows-x64.zip
            out/SHA256SUMS
            out/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    runs-on: windows-latest
    needs: build
    permissions:
      actions: read
    steps:
      - name: Download Windows x64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pi-windows-x64
          path: artifact

      - name: Extract and smoke-test
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath artifact/pi-windows-x64.zip -DestinationPath extracted -Force
          .\extracted\pi.exe --version
          .\extracted\pi.exe --help | Select-Object -First 20

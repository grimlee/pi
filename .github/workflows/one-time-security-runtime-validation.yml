name: One-time security runtime validation

on:
  push:
    branches:
      - fix/pi-npm-audit-20261102

permissions:
  contents: write

jobs:
  runtime-tests:
    if: github.repository == 'grimlee/pi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install build system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Script tests
        id: script_tests
        continue-on-error: true
        run: npm run test:scripts

      - name: Coding Agent tests
        id: coding_tests
        continue-on-error: true
        run: npm run test --workspace=@earendil-works/pi-coding-agent

      - name: AI package tests
        id: ai_tests
        continue-on-error: true
        run: npm run test --workspace=@earendil-works/pi-ai

      - name: Remove temporary test workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-time-security-runtime-validation.yml
          git commit -m "ci: remove completed one-time security runtime validation"
          git push origin HEAD:fix/pi-npm-audit-20261102

      - name: Report test failures
        if: always()
        run: |
          echo "Script tests: ${{ steps.script_tests.outcome }}"
          echo "Coding Agent tests: ${{ steps.coding_tests.outcome }}"
          echo "AI tests: ${{ steps.ai_tests.outcome }}"
          test "${{ steps.script_tests.outcome }}" = success
          test "${{ steps.coding_tests.outcome }}" = success
          test "${{ steps.ai_tests.outcome }}" = success
